# Provisional local MVP baseline. Values are configuration defaults, not capacity guarantees.
# Each index snapshot records the compatible embedding and chunking values.

[server]
host = "127.0.0.1"
port = 8000
allow_lan = false

[worker]
concurrency = 1
lease_seconds = 300
max_retries = 2

[models]
text_default_alias = "text-default"
text_default_model = "llama3.2:3b"
embedding_default_alias = "embedding-default"
embedding_default_model = "nomic-embed-text:latest"
embedding_dimensions = 768
embedding_query_prefix = "search_query: "
embedding_document_prefix = "search_document: "
generation_timeout_seconds = 120
generation_max_retries = 1
generation_context_window = 8192
embedding_timeout_seconds = 120
text_simple_model = "llama3.2:3b"
# Provisional until the fixed two-model benchmark and human review are complete.
text_complex_model = "qwen3.5:2b"
text_fallback_model = "llama3.2:3b"

[upload]
max_file_bytes = 104857600
max_pages = 1000
max_query_characters = 2000
max_feedback_characters = 1000

[extraction]
extractor_version = "pymupdf-direct-v2"
chunking_version = "page-section-v3-classified"
ocr_non_whitespace_character_threshold = 40
ocr_token_threshold = 8
ocr_low_text_character_threshold = 160
ocr_language = "spa"
ocr_timeout_seconds = 90

[retrieval]
candidates = 24
top_k = 6
minimum_similarity = 0.0
# Words of evidence; fits the generation context window below together with the prompt.
max_context_tokens = 2500
max_per_section = 2
# Provisional, calibrated on the reference corpus (docs/evaluation/baseline-2026-11-01.md).
sufficiency_minimum_score = 0.68

[cache]
exact_response_enabled = true
exact_ttl_seconds = 3600
semantic_ttl_seconds = 1800
# Calibrated 2026-11-02 with the pre-registered rule (docs/evaluation/acceptance-gates-v1.md):
# evaluation/runs/20261102T045930Z-CALIBRATION-bb4123.json, 0 held-out separation violations.
# Small sample and a 0.022 margin over the closest contradictory pair: see ADR-03.
semantic_threshold = 0.85

[guardrails]
policy_version = "guardrails-v1"

[agent]
max_iterations = 2

[router]
policy_version = "router-v1"

[breed_match]
policy_version = "breed-match-v1"
minimum_coverage = 0.5
max_candidates = 5

[retention]
trace_days = 30
deleted_source_days = 30
# Raw feedback comments are cleared after this window; the useful/not-useful signal remains.
feedback_comment_days = 90
confirmation_token_seconds = 300

[telemetry]
# Traces never store full questions, document text, files, secrets or raw feedback by default.
# Enabling this keeps full questions in stored traces for privileged troubleshooting exports only.
store_protected = false
