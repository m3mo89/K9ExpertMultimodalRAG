[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "k9-expert-rag"
version = "0.1.0"
description = "Local, grounded, document-versioned canine knowledge assistant"
requires-python = ">=3.13"
dependencies = [
  "chromadb>=1.5,<2",
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.14,<3",
  "pymupdf>=1.27,<2",
  "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/k9_expert"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
pythonpath = ["backend/src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/src/k9_expert/infrastructure/sqlite.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "backend/src"
packages = ["k9_expert"]

